name: Deployment smoke test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  streamlit-cloud-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLCONFIGDIR: /tmp/capstone-matplotlib
      TF_CPP_MIN_LOG_LEVEL: "2"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install cloud and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify packaged evidence
        run: |
          python scripts/verify_root_release_manifest.py
          python scripts/validate_integrated_release.py

      - name: Run deployment-focused tests
        run: |
          python -m pytest -q \
            tests/test_deployment_profile.py \
            tests/test_app_smoke.py \
            tests/test_integration_evidence.py \
            tests/test_no_downloads.py \
            tests/test_validator_release_safety.py

      - name: Launch Streamlit and check health
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            --server.headless=true \
            > /tmp/capstone-streamlit.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health \
              | grep --quiet "ok"; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/capstone-streamlit.log
          exit 1
